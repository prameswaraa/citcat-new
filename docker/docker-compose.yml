# KirimChat - All-in-One Docker Compose Stack
# One-click deployment for white-label partners

services:
  # PostgreSQL with pgvector extension
  postgres:
    image: ankane/pgvector:v0.5.1
    container_name: kirimchat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-kirimchat}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=en_US.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-kirimchat}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kirimchat

  # Redis for caching and queues
  redis:
    image: redis:7-alpine
    container_name: kirimchat-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kirimchat

  # Backend API (Hono + Prisma)
  backend:
    build:
      context: ..
      dockerfile: apps/backend/Dockerfile
    container_name: kirimchat-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3005
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-kirimchat}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_TLS: "false"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      BETTER_AUTH_URL: https://${DOMAIN}
      WEBHOOK_VERIFY_TOKEN: ${WEBHOOK_VERIFY_TOKEN}
      WABA_TOKEN_ENCRYPTION_KEY: ${WABA_TOKEN_ENCRYPTION_KEY}
      FRONTEND_URL: https://${DOMAIN}
      BACKEND_URL: https://${DOMAIN}
      CORS_ALLOWED_ORIGINS: https://${DOMAIN}
      COOKIE_DOMAIN: ${DOMAIN}
      # SMTP Configuration
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-KirimChat}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      # Meta/WhatsApp Configuration
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      # META_ACCESS_TOKEN removed - Each WABA uses per-account token (per Meta policy)
      META_CONFIG_ID: ${META_CONFIG_ID:-}
      # Google OAuth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # OpenAI
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Duitku Payment
      DUITKU_MERCHANT_CODE: ${DUITKU_MERCHANT_CODE:-}
      DUITKU_API_KEY: ${DUITKU_API_KEY:-}
      DUITKU_CALLBACK_URL: ${DUITKU_CALLBACK_URL:-}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - kirimchat

  # Frontend (Next.js Standalone)
  frontend:
    build:
      context: ..
      dockerfile: apps/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://${DOMAIN}
        NEXT_PUBLIC_APP_URL: https://${DOMAIN}
    container_name: kirimchat-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://${DOMAIN}
      NEXT_PUBLIC_APP_URL: https://${DOMAIN}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - kirimchat

  # Caddy Reverse Proxy with Auto SSL
  caddy:
    image: caddy:2-alpine
    container_name: kirimchat-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
      SSL_EMAIL: ${SSL_EMAIL:?SSL_EMAIL is required}
    depends_on:
      - frontend
      - backend
    networks:
      - kirimchat

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  kirimchat:
    driver: bridge
